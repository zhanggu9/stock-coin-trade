name: Deploy to EC2

# main 푸시 시 소스를 EC2로 직접 업로드(rsync)하고, SSL 오버레이로 재빌드·기동한 뒤
# HTTPS 헬스체크까지 수행하는 자체 완결형 배포. ECR/외부 저장소에 의존하지 않는다.
#
# 필요한 GitHub Secrets:
#   EC2_SSH_KEY : EC2 접속용 개인 키(pr-test.pem 내용). 필수.
#   EC2_HOST    : EC2 퍼블릭 주소(Elastic IP). 없으면 기본값 사용.
#   EC2_USER    : 접속 사용자. 없으면 ubuntu.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.EC2_HOST || '43.202.161.134' }}
      REMOTE_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      APP_DIR: /opt/stock-coin-trade
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: SSH 키 준비
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY 시크릿이 설정되지 않았습니다. 저장소 Settings → Secrets에 추가하세요."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 소스 업로드 (rsync)
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude='.git' --exclude='.github' \
            --exclude='.env' --exclude='*.pem' --exclude='*.key' \
            --exclude='certbot' --exclude='captures' \
            --exclude='node_modules' --exclude='__pycache__' \
            ./ "$REMOTE_USER@$HOST:$APP_DIR/"

      - name: 빌드 및 재기동 (SSL + pg-stock 오버레이)
        run: |
          # pg-stock 오버레이를 포함해야 --remove-orphans가 OHLCV DB를 지우지 않는다.
          # 재빌드로 python-backend IP가 바뀌면 nginx 업스트림 캐시가 낡아 502가 나므로
          # 마지막에 frontend를 재시작해 업스트림을 다시 해석시킨다.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$REMOTE_USER@$HOST" \
            "cd $APP_DIR && docker compose -p stock-coin-trade -f docker-compose.yml -f docker-compose.ssl.yml -f docker-compose.pg-stock.yml up -d --build --remove-orphans && docker restart crypto-mock-frontend && docker compose -p stock-coin-trade ps"

      - name: 헬스체크 (인스턴스 내부)
        # 보안그룹이 80/443을 특정 IP로 제한할 수 있으므로, 러너에서 공개 HTTPS로
        # 확인하지 않고 인스턴스에 SSH로 접속해 localhost로 확인한다.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$REMOTE_USER@$HOST" '
            sleep 12
            ok=0
            for i in $(seq 1 20); do
              code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 https://localhost/api/stocks/list || echo 000)
              echo "시도 $i: HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 6
            done
            [ "$ok" = "1" ] || { echo "::error::헬스체크 실패 (백엔드 기동 지연 또는 오류)"; exit 1; }
            echo "배포 및 헬스체크 성공"
          '

      - name: SSH 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
