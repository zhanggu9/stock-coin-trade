AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Redis 로그인 세션 TTL 진단 Lambda (lambda/session)

Parameters:
  RedisSecretArn:
    Type: String
    Description: REDIS_URL 키를 가진 Secrets Manager secret ARN
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  JwtIssuer:
    Type: String
    Description: Cognito 또는 OIDC JWT issuer URL
  JwtAudience:
    Type: CommaDelimitedList
    Description: 허용할 JWT audience 목록

Resources:
  PracticeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: PracticeJwtAuthorizer
        Authorizers:
          PracticeJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref JwtIssuer
              audience: !Ref JwtAudience

  DatabasePracticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: lambda_session_check.lambda_handler
      CodeUri: ../lambda/session/
      Timeout: 15
      MemorySize: 256
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref RedisSecretArn
      Environment:
        Variables:
          REDIS_SECRET_ARN: !Ref RedisSecretArn
          # sam local의 env.json이 이 값을 덮어쓴다. AWS에서는 빈 값이므로 Secret을 사용한다.
          REDIS_URL: ""
          REDIS_SESSION_KEY_PREFIX: "stock-coin-trade:session:"
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PracticeHttpApi
            Path: /internal/session-check
            Method: GET

Outputs:
  ApiUrl:
    Description: JWT 인증이 필요한 Redis 세션 진단 API 기본 URL
    Value: !Sub 'https://${PracticeHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
