AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PostgreSQL Quant DB 최근 시세 조회 Lambda (lambda/quant)

Parameters:
  QuantSecretArn:
    Type: String
    Description: QUANT_DATABASE_URL 키를 가진 Secrets Manager secret ARN
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  DatabasePracticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: lambda_quant.lambda_handler
      CodeUri: ../lambda/quant/
      Timeout: 15
      MemorySize: 512
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref QuantSecretArn
      Environment:
        Variables:
          QUANT_SECRET_ARN: !Ref QuantSecretArn
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /quant/prices
            Method: GET

Outputs:
  ApiUrl:
    Description: Quant 조회 API 기본 URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
