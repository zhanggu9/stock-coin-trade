AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MariaDB 서비스 DB 회원 조회 Lambda (lambda/member)

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: EC2 Docker MariaDB 접속 URL (mysql+pymysql://...@EC2_PRIVATE_IP:3306/mockinv)
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  JwtIssuer:
    Type: String
    Description: Cognito 또는 OIDC JWT issuer URL
  JwtAudience:
    Type: CommaDelimitedList
    Description: 허용할 JWT audience 목록

Resources:
  PracticeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: PracticeJwtAuthorizer
        Authorizers:
          PracticeJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref JwtIssuer
              audience: !Ref JwtAudience

  DatabasePracticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: lambda_member.lambda_handler
      CodeUri: ../lambda/member/
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PracticeHttpApi
            Path: /members/{member_id}
            Method: GET

Outputs:
  ApiUrl:
    Description: JWT 인증이 필요한 회원 조회 API 기본 URL
    Value: !Sub 'https://${PracticeHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
