AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Qdrant 지식 DB 유사도 검색 Lambda (lambda/knowledge)

Parameters:
  QdrantUrl:
    Type: String
    Description: EC2 Docker Qdrant 접속 URL
  QdrantApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Qdrant API key (인증을 사용하지 않는 현재 Docker 구성은 빈 값)
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  DatabasePracticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: lambda_knowledge_search.lambda_handler
      CodeUri: ../lambda/knowledge/
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          QDRANT_URL: !Ref QdrantUrl
          QDRANT_API_KEY: !Ref QdrantApiKey
          QDRANT_COLLECTION: market_knowledge
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /knowledge/search
            Method: POST

Outputs:
  ApiUrl:
    Description: Qdrant 지식 검색 API 기본 URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
