networks:
  internal:
    driver: bridge

services:

  # ── 프론트엔드 (Nginx + 정적 파일) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: crypto-mock-frontend
    networks:
      - internal
    ports:
      - "3000:80"
    depends_on:
      - python-backend
    restart: unless-stopped

  # ── MariaDB (로컬 개발용 컨테이너 DB) ─────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: crypto-mock-mariadb
    profiles: ["local-db"]
    networks:
      - internal
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mockinv}
      MARIADB_USER: ${MARIADB_USER:-mockinv}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-12345678!!}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-12345678!!}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Python 백엔드 (Flask REST API — 코인/주식/회원/관리자/AI 전부 처리) ──
  python-backend:
    build:
      context: .
      dockerfile: docker/python-backend.Dockerfile
    container_name: crypto-mock-python
    networks:
      - internal
    expose:
      - "8200"
    environment:
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MARIADB_DATABASE:-mockinv}
      DB_USER: ${MARIADB_USER:-mockinv}
      DB_PASSWORD: ${MARIADB_PASSWORD:-12345678!!}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CMC_API_KEY: ${CMC_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 기존 회원·보유자산을 변경하지 않고 없는 샘플 투자자만 추가한다.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    # 키 파일은 이미지에 복사하지 않고 읽기 전용으로만 전달한다.
    volumes:
      - ./al.key:/run/secrets/al.key:ro
      - ./kb.key:/run/secrets/kb.key:ro
      - ./kis.key:/run/secrets/kis.key:ro
    restart: unless-stopped

volumes:
  mariadb-data:
