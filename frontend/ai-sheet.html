<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sheet — EDUMGT</title><link rel="icon" href="/img/favicon.png">
  <style>@font-face{font-family:Pretendard;font-weight:400;src:url('/fonts/Pretendard-Regular.woff2')}@font-face{font-family:Pretendard;font-weight:700;src:url('/fonts/Pretendard-Bold.woff2')}</style>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css?v=20260809-ai-sheet"><link rel="stylesheet" href="/css/ai-sheet.css?v=20260809-1">
</head>
<body><div id="header-mount"></div>
  <main class="sheet-page">
    <section class="sheet-hero"><span>AI SHEET</span><h1>웹 데이터를 바로 시트로</h1><p>공개 웹페이지의 표와 본문을 가져와, 엑셀처럼 편집·정렬·다운로드하세요.</p></section>
    <section class="sheet-card"><form id="crawl-form" class="crawl-form"><label for="source-url">가져올 페이지 URL</label><div><input id="source-url" type="url" required placeholder="https://example.com/report"><button id="crawl-button" type="submit">시트 만들기</button></div><p>공개 HTML 페이지의 표를 우선 추출합니다. 로그인·차단된 페이지와 PDF는 지원하지 않습니다.</p></form></section>
    <section id="sheet-status" class="sheet-status" aria-live="polite">URL을 입력하면 데이터 시트를 만듭니다.</section>
    <section id="sheet-workspace" class="sheet-card workspace" hidden><div class="sheet-toolbar"><div><h2 id="sheet-title"></h2><a id="sheet-source" target="_blank" rel="noopener">원문 열기 ↗</a></div><div><button type="button" id="add-row">행 추가</button><button type="button" id="download-csv">CSV 다운로드</button></div></div><div class="table-scroll"><table id="data-sheet"></table></div><p class="sheet-footnote">셀을 클릭해 직접 수정할 수 있습니다. 추출 값은 원문과 대조해 확인하세요.</p></section>
  </main>
  <script src="/js/config.js"></script><script src="/js/common.js?v=20260809-ai-sheet"></script><script src="/js/ai-sheet.js?v=20260809-1"></script>
</body></html>
