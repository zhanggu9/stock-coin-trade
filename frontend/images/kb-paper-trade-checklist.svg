<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="title desc">
<title id="title">KB증권 모의투자 주문 전 확인 항목</title><desc id="desc">모의투자 모드, 상품 확인, 주문 조건, 이력 대조의 네 단계 체크리스트</desc>
<rect width="1200" height="350" rx="24" fill="#F8FAFC"/><text x="58" y="64" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0F172A">모의 주문 전 4가지 확인</text>
<g font-family="Arial,sans-serif"><g><circle cx="108" cy="145" r="29" fill="#2563EB"/><text x="99" y="154" font-size="20" font-weight="700" fill="#fff">1</text><text x="157" y="140" font-size="18" font-weight="700" fill="#1E3A8A">모의투자 모드</text><text x="157" y="165" font-size="14" fill="#475569">모의 ID · 가상 예탁금 · 화면 표시</text></g><path d="M70 211h1060" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="7 8"/><g><circle cx="382" cy="211" r="29" fill="#0F766E"/><text x="373" y="220" font-size="20" font-weight="700" fill="#fff">2</text><text x="431" y="206" font-size="18" font-weight="700" fill="#115E59">상품 선택</text><text x="431" y="231" font-size="14" fill="#475569">종목 · 월물 · 거래소 · 현재가</text></g><g><circle cx="650" cy="211" r="29" fill="#B45309"/><text x="641" y="220" font-size="20" font-weight="700" fill="#fff">3</text><text x="699" y="206" font-size="18" font-weight="700" fill="#92400E">주문 조건</text><text x="699" y="231" font-size="14" fill="#475569">매수/매도 · 수량 · 가격 · 취소 위치</text></g><g><circle cx="917" cy="211" r="29" fill="#7C3AED"/><text x="908" y="220" font-size="20" font-weight="700" fill="#fff">4</text><text x="966" y="206" font-size="18" font-weight="700" fill="#5B21B6">이력 대조</text><text x="966" y="231" font-size="14" fill="#475569">주문번호 · 체결 · 잔고 · 손익</text></g></g>
<rect x="58" y="278" width="1080" height="38" rx="8" fill="#FFF7ED"/><text x="76" y="303" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#9A3412">하나라도 확인되지 않으면 전송하지 마세요. 실거래 화면과 모의투자 화면의 메뉴·조건은 서비스 업데이트에 따라 달라질 수 있습니다.</text></svg>
