<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title desc">
<title id="title">KIS 모의투자 API 안전한 요청 흐름</title><desc id="desc">환경변수, 접근 토큰, 조회, 주문 검증, 체결 확인을 분리한 서버 측 흐름도</desc>
<rect width="1200" height="390" rx="24" fill="#F8FAFC"/><text x="55" y="64" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0F172A">KIS 모의투자 · 브라우저가 아닌 서버에서 처리하는 요청 흐름</text>
<g font-family="Arial,sans-serif"><rect x="56" y="112" width="192" height="180" rx="14" fill="#FFF7ED" stroke="#FDBA74"/><text x="78" y="154" font-size="18" font-weight="700" fill="#9A3412">1. Secret 저장소</text><text x="78" y="184" font-size="13" fill="#475569">.env / 배포 Secret</text><text x="78" y="207" font-size="13" fill="#475569">App Key · Secret</text><text x="78" y="230" font-size="13" fill="#475569">모의 계좌 정보</text><text x="78" y="264" font-size="13" font-weight="700" fill="#B91C1C">브라우저·Git 금지</text><text x="265" y="210" font-size="32" fill="#2563EB">→</text><rect x="313" y="112" width="192" height="180" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/><text x="337" y="154" font-size="18" font-weight="700" fill="#075985">2. 서버 인증</text><text x="337" y="184" font-size="13" fill="#475569">/oauth2/tokenP</text><text x="337" y="207" font-size="13" fill="#475569">토큰 만료시각 저장</text><text x="337" y="230" font-size="13" fill="#475569">실패 응답 마스킹</text><text x="522" y="210" font-size="32" fill="#2563EB">→</text><rect x="570" y="112" width="192" height="180" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/><text x="595" y="154" font-size="18" font-weight="700" fill="#065F46">3. 읽기 전용 조회</text><text x="595" y="184" font-size="13" fill="#475569">시세 · 잔고 · 주문조회</text><text x="595" y="207" font-size="13" fill="#475569">파라미터 검증</text><text x="595" y="230" font-size="13" fill="#475569">호출 간격 제한</text><text x="779" y="210" font-size="32" fill="#2563EB">→</text><rect x="827" y="112" width="316" height="180" rx="14" fill="#EEF2FF" stroke="#A5B4FC"/><text x="852" y="154" font-size="18" font-weight="700" fill="#3730A3">4. 모의 주문 · 사후 검증</text><text x="852" y="184" font-size="13" fill="#475569">KIS_MODE=mock · 모의 tr_id 강제</text><text x="852" y="207" font-size="13" fill="#475569">수량 상한 · 확인 단계 · 중복 방지</text><text x="852" y="230" font-size="13" fill="#475569">응답 rt_cd · msg_cd · 주문번호 저장</text><text x="852" y="253" font-size="13" fill="#475569">미체결 · 체결 · 잔고를 다시 대조</text></g>
<text x="57" y="345" font-family="Arial,sans-serif" font-size="14" fill="#475569">교육용 구조도 · KIS 모의 서버 URL과 주문 파라미터는 구현 직전 공식 API 문서·샘플의 최신 명세를 재확인하세요.</text></svg>
