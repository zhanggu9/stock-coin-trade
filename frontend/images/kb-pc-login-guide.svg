  <text x="496" y="145" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">클라우드인증서</text><text x="519" y="164" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">로그인</text>
  <text x="647" y="145" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">브라우저인증서</text><text x="669" y="164" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">로그인</text>
  <text x="810" y="151" fill="#6b5431" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17" font-weight="700">ID 로그인</text>
