<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">KB증권 PC 웹사이트 ID 로그인 화면 예시</title>
  <desc id="desc">KB증권 앱에서 계좌와 ID를 등록한 뒤 PC 웹사이트에서 ID와 비밀번호로 로그인하는 창을 보여주는 안내 이미지</desc>
  <rect width="1200" height="680" fill="#f0f0f0"/>
  <rect x="0" y="0" width="1200" height="78" fill="#fff"/>
  <text x="76" y="48" fill="#8b6100" font-family="Arial, sans-serif" font-size="31" font-weight="700">KB</text>
  <text x="128" y="48" fill="#2b2b2b" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="25" font-weight="700">증권</text>
  <text x="340" y="49" fill="#222" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="21">금융상품　 뱅킹/대출　 주식/선물　 투자정보　 자산관리　 연금자산　 고객서비스</text>
  <line x1="0" y1="77" x2="1200" y2="77" stroke="#b78a00" stroke-width="2"/>
  <rect x="266" y="62" width="670" height="550" fill="#fff" stroke="#6b6254" stroke-width="3"/>
