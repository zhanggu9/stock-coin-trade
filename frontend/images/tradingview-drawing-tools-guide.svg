<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">TradingView 왼쪽 도구 모음으로 추세선과 지지·저항선을 그리는 예시</title><desc id="desc">왼쪽 세로 도구 모음에서 추세선 도구를 선택해 고점을 잇는 추세선을 그리고 자석 기능과 Alt+H 단축키로 그림을 관리하는 것을 보여주는 교육용 참고 이미지</desc>
  <rect width="1400" height="520" fill="#f8f9fa"/>
