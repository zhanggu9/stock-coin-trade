  <rect x="0" y="34" width="46" height="486" fill="#fff" stroke="#dce0e3"/>
  <g font-family="Arial" font-size="18" fill="#555">
    <text x="14" y="70">↗</text><text x="14" y="110" font-weight="900">╱</text><text x="12" y="150">▤</text><text x="12" y="190">◲</text><text x="12" y="230">✎</text><text x="14" y="270">T</text><text x="12" y="310">☺</text>
  </g>
