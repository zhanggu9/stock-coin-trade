  <text x="74" y="174" font-family="Arial" font-size="13" font-weight="700" fill="#8c0060">추세선 도구 선택 후 고점 두 곳을</text>
  <text x="74" y="194" font-family="Arial" font-size="13" font-weight="700" fill="#8c0060">클릭해 선으로 연결</text>

