  <g stroke="#00a99b" stroke-width="9"><line x1="90" y1="330" x2="90" y2="390"/><line x1="170" y1="290" x2="170" y2="350"/><line x1="330" y1="200" x2="330" y2="260"/><line x1="570" y1="140" x2="570" y2="200"/><line x1="730" y1="100" x2="730" y2="160"/><line x1="970" y1="160" x2="970" y2="220"/><line x1="1130" y1="120" x2="1130" y2="180"/></g>
