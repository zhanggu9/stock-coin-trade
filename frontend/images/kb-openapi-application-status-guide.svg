<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">KB증권 Open API 최종 신청 현황 화면 예시</title>
  <desc id="desc">Open API 신청 완료 후 신청 계좌, 신청일자, 만료일, 갱신, App Key와 App Secret 복사 항목을 확인하는 화면 예시</desc>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="58" y="64" fill="#172033" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="31" font-weight="700">Open API 신청/조회</text>
  <text x="58" y="126" fill="#172033" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="700">신청계좌</text>
  <rect x="58" y="144" width="1080" height="44" fill="#fff" stroke="#cbd5e1"/><rect x="58" y="144" width="160" height="44" fill="#f4f4f4" stroke="#cbd5e1"/><text x="105" y="173" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">계좌번호</text><rect x="235" y="156" width="100" height="20" rx="10" fill="#172033"/><text x="348" y="173" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">본인 계좌 선택 ▾</text><rect x="760" y="144" width="160" height="44" fill="#f4f4f4" stroke="#cbd5e1"/><text x="805" y="173" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">비밀번호</text><rect x="920" y="144" width="218" height="44" fill="#fff" stroke="#cbd5e1"/><text x="942" y="173" fill="#333" font-family="Arial, sans-serif" font-size="18">••••••••</text>
  <text x="58" y="254" fill="#172033" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="700">기본정보</text><rect x="58" y="272" width="1080" height="42" fill="#fff" stroke="#cbd5e1"/><rect x="58" y="272" width="142" height="42" fill="#f4f4f4" stroke="#cbd5e1"/><text x="100" y="299" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">고객명</text><text x="218" y="299" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">본인</text><rect x="502" y="272" width="142" height="42" fill="#f4f4f4" stroke="#cbd5e1"/><text x="548" y="299" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">이메일</text><rect x="670" y="285" width="152" height="18" rx="9" fill="#172033"/>
  <text x="58" y="379" fill="#172033" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="700">신청현황</text>
  <rect x="58" y="398" width="1080" height="46" fill="#f4f4f4" stroke="#cbd5e1"/><rect x="58" y="444" width="1080" height="90" fill="#fff" stroke="#cbd5e1"/>
  <line x1="260" y1="398" x2="260" y2="534" stroke="#cbd5e1"/><line x1="458" y1="398" x2="458" y2="534" stroke="#cbd5e1"/><line x1="656" y1="398" x2="656" y2="534" stroke="#cbd5e1"/><line x1="780" y1="398" x2="780" y2="534" stroke="#cbd5e1"/><line x1="920" y1="398" x2="920" y2="534" stroke="#cbd5e1"/><line x1="780" y1="489" x2="1138" y2="489" stroke="#cbd5e1"/>
  <text x="116" y="427" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">계좌번호</text><text x="325" y="427" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">신청일자</text><text x="527" y="427" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">만료일</text><text x="695" y="427" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">갱신</text><text x="963" y="427" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">App key/Secret</text>
  <rect x="105" y="477" width="102" height="20" rx="10" fill="#172033"/><text x="305" y="497" fill="#475569" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15">신청 화면 확인</text><text x="505" y="497" fill="#475569" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15">신청 화면 확인</text><rect x="682" y="475" width="56" height="28" fill="#f4f4f4" stroke="#cbd5e1"/><text x="696" y="495" fill="#64748b" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14">갱신</text><text x="798" y="474" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15">App Key</text><rect x="1053" y="456" width="58" height="26" fill="#fff" stroke="#9ca3af"/><text x="1069" y="475" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14">복사</text><text x="798" y="520" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15">App Secret</text><rect x="1053" y="502" width="58" height="26" fill="#fff" stroke="#9ca3af"/><text x="1069" y="521" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14">복사</text>
  <text x="58" y="574" fill="#78350f" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">※ 갱신 가능 시점과 이용기간은 신청현황 화면의 최신 안내를 기준으로 확인합니다.</text>
  <rect x="58" y="608" width="1080" height="76" rx="10" fill="#fff1f2" stroke="#fda4af"/><text x="86" y="640" fill="#9f1239" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="19" font-weight="700">App Key와 App Secret은 한 번 복사해 서버 환경변수에만 저장하세요.</text><text x="86" y="669" fill="#9f1239" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">화면 캡처, 메신저, 이메일, Git 저장소, 프런트엔드 코드에는 절대 공유하거나 기록하지 않습니다.</text>
</svg>
