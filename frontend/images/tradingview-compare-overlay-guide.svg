  <circle cx="1240" cy="130" r="22" fill="#d3008f"/><text x="1233" y="137" font-family="Arial" font-size="18" font-weight="700" fill="#fff">3</text>
  <path d="M1240 152 L1180 190" stroke="#d3008f" stroke-width="8" stroke-linecap="round" fill="none"/><path d="m1170 182 10 30 26-22z" fill="#d3008f"/>
