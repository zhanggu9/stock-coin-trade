<svg xmlns="http://www.w3.org/2000/svg" width="1412" height="852" viewBox="0 0 1412 852" role="img" aria-labelledby="title desc">
  <title id="title">TradingView Essential 플랜 카드 결제 등록 안내</title><desc id="desc">무료 체험을 시작하기 위한 청구지 주소와 신용카드 결제 방법 입력 화면의 교육용 참고 이미지</desc>
  <rect width="1412" height="852" fill="#fff"/><path d="M659 0h10l6 16 7-16h10l-13 27h-11z" fill="#111"/><text x="695" y="15" font-family="Arial, sans-serif" font-size="20" font-weight="700">TradingView</text>
  <g font-family="Arial, sans-serif"><text x="120" y="98" font-size="28" font-weight="700" fill="#101114">Essential 플랜을 30 일 동안 무료로 사용해 보세요</text><text x="121" y="158" font-size="20" font-weight="700">1. 청구지 주소</text>
  <g font-size="13" fill="#62666d"><text x="121" y="191">Full name</text><text x="121" y="269">국가</text><text x="121" y="347">주소 라인 1</text><text x="121" y="425">주소 라인 2</text><text x="121" y="503">시</text><text x="351" y="503">주/지역</text><text x="581" y="503">우편번호</text></g>
  <g fill="#fff" stroke="#d8dadd"><rect x="121" y="200" width="681" height="40" rx="9"/><rect x="121" y="278" width="681" height="40" rx="9"/><rect x="121" y="356" width="681" height="40" rx="9"/><rect x="121" y="434" width="681" height="40" rx="9"/><rect x="121" y="512" width="218" height="40" rx="9"/><rect x="351" y="512" width="218" height="40" rx="9"/><rect x="582" y="512" width="220" height="40" rx="9"/></g><text x="129" y="226" font-size="15" fill="#62666d">First and last name</text><text x="129" y="304" font-size="15" fill="#222">🇰🇷  대한민국</text><path d="m781 296 5 5 5-5" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="121" y="605" font-size="20" font-weight="700">2. 결제 방법</text><rect x="120" y="624" width="682" height="260" rx="16" fill="#fff" stroke="#191919" stroke-width="2"/><circle cx="147" cy="653" r="9" fill="#333"/><circle cx="147" cy="653" r="3" fill="#fff"/><text x="164" y="659" font-size="16" font-weight="700">신용카드 또는 직불카드</text><rect x="752" y="644" width="31" height="20" rx="2" fill="none" stroke="#333"/><path d="M753 652h29" stroke="#333"/><text x="138" y="696" font-size="13" fill="#62666d">카드 번호</text><rect x="138" y="704" width="646" height="41" rx="8" fill="#fff" stroke="#e0e1e4"/><text x="154" y="730" font-size="14" fill="#777">1234 1234 1234 1234</text><g font-size="9" font-weight="700"><text x="143" y="767" fill="#1a48aa">VISA</text><text x="173" y="767" fill="#f44">●</text><text x="183" y="767" fill="#f1b500">●</text><text x="210" y="767" fill="#0771b8">AMEX</text></g><text x="138" y="800" font-size="13" fill="#62666d">만기 날짜</text><text x="469" y="800" font-size="13" fill="#62666d">보안 코드</text><rect x="138" y="808" width="315" height="40" rx="8" fill="#fff" stroke="#e0e1e4"/><rect x="469" y="808" width="315" height="40" rx="8" fill="#fff" stroke="#e0e1e4"/></g>
  <rect x="865" y="70" width="473" height="625" rx="18" fill="#fff" stroke="#ebedf0"/><g font-family="Arial, sans-serif"><circle cx="904" cy="105" r="15" fill="#080808"/><path d="m898 105 4 4 7-8" fill="none" stroke="#fff" stroke-width="1.4"/><text x="935" y="111" font-size="16" font-weight="700">오늘</text><text x="935" y="139" font-size="15" fill="#555">무료 체험 시작 — Essential 플랜의 모든 기능을 살펴보</text><text x="935" y="162" font-size="15" fill="#555">세요.</text><line x1="904" y1="120" x2="904" y2="321" stroke="#e3e5e8" stroke-width="2" stroke-dasharray="3 4"/><circle cx="904" cy="197" r="15" fill="#ebedf0"/><text x="935" y="203" font-size="16" font-weight="700">일 15</text><text x="935" y="230" font-size="15" fill="#555">이메일로 알림을 보내드리겠습니다.</text><circle cx="904" cy="265" r="15" fill="#ebedf0"/><text x="935" y="271" font-size="16" font-weight="700">일 30</text><text x="935" y="299" font-size="15" fill="#555">취소하지 않으면 구독은 9월 11, 2026부터 시작됩니다.</text><circle cx="904" cy="334" r="15" fill="#ebedf0"/><text x="935" y="340" font-size="16" font-weight="700">환불 정책</text><text x="935" y="367" font-size="15" fill="#555">결제일로부터 14 일 이내에 전액 환불을 요청할 수 있습</text><text x="935" y="389" font-size="15" fill="#555">니다.</text><line x1="889" y1="410" x2="1314" y2="410" stroke="#e8e9eb"/><text x="889" y="447" font-size="16" font-weight="700">오늘 마감</text><text x="1250" y="447" font-size="14" fill="#008b7d">US $0.00</text><text x="889" y="480" font-size="15" fill="#333">마감일 9월 11, 2026</text><text x="1228" y="480" font-size="15" fill="#333">$155.40 / 해</text><line x1="889" y1="500" x2="1314" y2="500" stroke="#e8e9eb"/><rect x="889" y="509" width="17" height="17" rx="2" fill="#fff" stroke="#333"/><text x="916" y="521" font-size="13" fill="#222">30일 무료 체험에 가입합니다. 체험 기간 동안 취소하지 않으면</text><text x="916" y="539" font-size="13" fill="#222">$155.40 / 해 금액이 결제 수단에 청구됩니다.</text><rect x="889" y="582" width="425" height="48" rx="7" fill="#333"/><text x="1016" y="612" font-size="16" font-weight="700" fill="#fff">30-일 무료 트라이얼 시작</text><text x="968" y="655" font-size="12" fill="#555">구매를 완료함으로써 귀하는 당사의 이용약관</text><text x="968" y="672" font-size="12" fill="#555">및 개인정보 보호정책에 동의하는 것으로 간주됩니다.</text></g>
</svg>
