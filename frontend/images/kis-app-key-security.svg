  <text x="80" y="532" fill="#9f1239" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="19" font-weight="700">복사한 키는 .env에만 저장하고 .gitignore로 제외합니다</text>
  <text x="80" y="564" fill="#881337" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17">채팅·이메일·스크린샷·Git 저장소·프런트엔드 코드에 붙여 넣지 마세요.</text>
