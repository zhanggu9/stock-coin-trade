<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">KIS 신청현황에서 본인 App Key와 App Secret 확인 및 보안 설정</title>
  <desc id="desc">실전투자계좌와 모의투자계좌 행에서 각각 App Key와 App Secret을 확인할 수 있으며, 키를 복사한 뒤 환경변수 파일에만 저장하고 Git에 공유하지 않아야 함을 보여주는 안내 이미지</desc>
  <rect width="1200" height="640" fill="#fff"/>
  <rect x="1" y="1" width="1198" height="638" fill="none" stroke="#d8e0e5"/>
  <text x="50" y="62" fill="#172033" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="30" font-weight="700">신청현황에서 본인 API 키 확인</text>
  <text x="50" y="96" fill="#64748b" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="17">계좌 유형별 App Key·App Secret은 서로 다릅니다. 필요한 환경의 값만 사용하세요.</text>
  <rect x="50" y="132" width="1100" height="72" fill="#f3f8fb" stroke="#cbd5e1"/>
  <rect x="50" y="204" width="1100" height="111" fill="#fff" stroke="#cbd5e1"/>
  <rect x="50" y="315" width="1100" height="111" fill="#fff" stroke="#cbd5e1"/>
