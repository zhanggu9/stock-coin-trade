<svg xmlns="http://www.w3.org/2000/svg" width="1446" height="857" viewBox="0 0 1446 857" role="img" aria-labelledby="title desc">
  <title id="title">TradingView 계정 설정 비밀번호 안내 화면</title>
  <desc id="desc">TradingView 설정 화면 위에 비밀번호 설정을 안내하는 팝업이 표시된 교육용 참고 이미지</desc>
  <rect width="1446" height="857" fill="#f7f8fa"/>
  <rect width="1446" height="64" fill="#fff"/><path d="M6 9h11l7 17 8-17h11l-14 29H17z" fill="#131722"/><text x="48" y="27" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#131722">TradingView</text>
  <rect x="356" y="7" width="162" height="42" rx="22" fill="#f0f1f4"/><circle cx="378" cy="27" r="8" fill="none" stroke="#555" stroke-width="2"/><path d="m384 33 5 5" stroke="#555" stroke-width="2"/><text x="398" y="32" font-family="Arial, sans-serif" font-size="14" fill="#555">찾기 (Ctrl+K)</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#131722"><text x="550" y="31">프로덕트</text><text x="658" y="31">커뮤니티</text><text x="767" y="31">마켓</text><text x="845" y="31">브로커</text><text x="937" y="31">더보기</text></g><circle cx="1192" cy="27" r="20" fill="#9ab87c"/><text x="1185" y="34" font-family="Arial" font-size="22" fill="#fff">K</text><rect x="1222" y="0" width="132" height="34" rx="3" fill="#2d9fe9"/><text x="1242" y="17" font-family="Arial" font-size="12" font-weight="700" fill="#fff">지금 업그레이드</text><text x="1242" y="29" font-family="Arial" font-size="11" fill="#fff">30일 무료 평가판</text>
  <g font-family="Arial, sans-serif"><text x="241" y="123" font-size="31" font-weight="700" fill="#20252d">설정</text><text x="241" y="192" font-size="12" fill="#6b7280">프로필 및 개인정보</text><text x="241" y="227" font-size="16" fill="#1f2937">공개 프로필</text><text x="241" y="263" font-size="16" fill="#1f2937">개인정보 설정</text><text x="241" y="316" font-size="12" fill="#6b7280">계정 및 보안</text><rect x="224" y="325" width="200" height="40" rx="8" fill="#e7e9ed"/><text x="241" y="351" font-size="16" font-weight="700" fill="#1f2937">계정 설정</text><text x="241" y="389" font-size="16" fill="#1f2937">활성 세션</text><text x="241" y="442" font-size="12" fill="#6b7280">비용청구</text><text x="241" y="475" font-size="16" fill="#1f2937">구독</text><text x="241" y="514" font-size="16" fill="#1f2937">결제 방법</text><text x="241" y="553" font-size="16" fill="#1f2937">결제 기록</text></g>
  <g font-family="Arial, sans-serif"><text x="464" y="197" font-size="23" font-weight="700" fill="#20252d">로그인 자격증명</text><text x="464" y="238" font-size="14" fill="#535b67">이메일</text><text x="464" y="264" font-size="16" fill="#20252d">ki••••••@gm•••••</text><rect x="1018" y="228" width="125" height="39" rx="8" fill="#fff" stroke="#d7dbe1"/><text x="1034" y="253" font-size="15" fill="#1f2937">이메일 바꾸기</text><line x1="464" y1="283" x2="1143" y2="283" stroke="#dde1e6"/><rect x="464" y="296" width="125" height="40" rx="8" fill="#fff" stroke="#d7dbe1"/><text x="480" y="321" font-size="15" fill="#1f2937">비밀번호 추가</text><text x="464" y="405" font-size="22" font-weight="700" fill="#20252d">2-팩터 인증</text><text x="464" y="433" font-size="15" fill="#535b67">이중 인증으로 계정을 보호하세요.</text><line x1="464" y1="548" x2="1143" y2="548" stroke="#dde1e6"/><text x="464" y="748" font-size="22" font-weight="700" fill="#20252d">연결된 외부 계정</text></g>
  <rect width="1446" height="857" fill="#000" opacity=".22"/>
  <rect x="623" y="311" width="481" height="251" rx="8" fill="#fff" stroke="#d8dbe0"/><path d="m1071 330 15 15m0-15-15 15" stroke="#1f2937" stroke-width="1.5"/><g font-family="Arial, sans-serif"><text x="664" y="371" font-size="21" font-weight="700" fill="#15191f">비밀번호는 필수입니다</text><text x="664" y="408" font-size="16" fill="#222831">패스워드 만드는 법을 설명한 이메일을 보냈습니다. 이메일</text><text x="664" y="432" font-size="16" fill="#222831">에 나오는 링크를 클릭하여 패스워드를 세팅한 뒤 2 팩터 인</text><text x="664" y="456" font-size="16" fill="#222831">증을 켜시기 바랍니다.</text><rect x="966" y="488" width="98" height="34" rx="6" fill="#292b2f"/><text x="979" y="511" font-size="14" font-weight="700" fill="#fff">알겠습니다</text></g>
</svg>
