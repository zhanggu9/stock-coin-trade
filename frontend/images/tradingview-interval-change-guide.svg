<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
  <title id="title">TradingView 상단 툴바에서 시간봉(인터벌)을 변경하는 예시</title><desc id="desc">종목명 옆 날짜 시간봉 버튼을 클릭해 1시간 등 원하는 인터벌로 바꾸면 같은 종목이 더 짧은 주기의 캔들로 다시 그려지는 것을 보여주는 교육용 참고 이미지</desc>
  <rect width="1500" height="460" fill="#f8f9fa"/>
