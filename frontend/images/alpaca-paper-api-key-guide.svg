  <rect x="270" y="525" width="900" height="106" rx="10" fill="#fff7ed" stroke="#fed7aa"/><text x="294" y="558" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">Paper API Key 생성 순서</text><text x="294" y="588" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">1. Paper Trading 계정 선택  →  2. Home 화면 열기  →  3. Generate New Keys 선택</text><text x="294" y="614" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">Secret Key는 최초 표시 후 다시 볼 수 없을 수 있으므로 안전한 비밀 저장소에만 보관하세요.</text>
