<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Alpaca Paper Trading API Key 생성 위치 안내</title>
  <desc id="desc">Paper Trading 계정 선택, Home 메뉴, API Keys의 Generate New Keys 버튼을 차례로 가리키는 교육용 대시보드 그림</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="58" fill="#ffdf28"/>
