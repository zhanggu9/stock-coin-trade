  <g font-family="Arial, sans-serif" font-size="16" fill="#111827"><text x="42" y="183">⌂  Home</text><text x="42" y="228">▣  Account</text><text x="42" y="273">☁  Alpaca Connect</text><text x="42" y="318">◇  Plans &amp; Features</text><text x="42" y="363">▣  API</text><text x="42" y="408">◌  Community</text></g>
  <rect x="270" y="83" width="610" height="42" rx="8" fill="#fff" stroke="#94a3b8"/><text x="290" y="110" font-family="Arial, sans-serif" font-size="15" fill="#64748b">⌕  Search by symbol...</text>
  <rect x="270" y="145" width="900" height="45" rx="8" fill="#eef2ff"/><text x="290" y="173" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">ⓘ  You are on Paper Trading, no real money is being used.</text>
  <text x="272" y="238" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Home</text>
