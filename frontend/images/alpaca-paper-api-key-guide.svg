  <rect x="905" y="270" width="265" height="210" rx="10" fill="#fff" stroke="#d1d5db"/><text x="928" y="310" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">API Keys</text><text x="928" y="345" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Endpoint</text><rect x="928" y="355" width="218" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text x="938" y="377" font-family="Arial, sans-serif" font-size="12" fill="#334155">paper-api.alpaca.markets/v2</text><rect x="928" y="408" width="218" height="46" rx="6" fill="#fff" stroke="#f2b800" stroke-width="2"/><text x="963" y="438" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Generate New Keys</text>
