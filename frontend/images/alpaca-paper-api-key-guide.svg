  <text x="62" y="37" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Alpaca</text>
  <rect x="0" y="58" width="240" height="622" fill="#fff" stroke="#e5e7eb"/>
  <rect x="16" y="78" width="207" height="58" rx="6" fill="#fff" stroke="#cbd5e1"/>
