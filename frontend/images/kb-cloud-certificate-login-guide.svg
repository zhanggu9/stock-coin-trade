<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">KB증권 클라우드 인증서 로그인 화면 예시</title>
  <desc id="desc">KB증권 로그인 창에서 클라우드 인증서 로그인 탭을 선택하고 로그인 버튼을 누르는 화면과 인증서 등록 안내를 보여주는 이미지</desc>
  <rect width="1200" height="720" fill="#efefef"/>
  <rect x="0" y="0" width="1200" height="78" fill="#fff"/><text x="78" y="49" fill="#8b6100" font-family="Arial, sans-serif" font-size="31" font-weight="700">KB</text><text x="130" y="49" fill="#2b2b2b" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="25" font-weight="700">증권</text><line x1="0" y1="77" x2="1200" y2="77" stroke="#b78a00" stroke-width="2"/>
  <rect x="256" y="52" width="690" height="600" fill="#fff" stroke="#6b6254" stroke-width="3"/>
  <text x="896" y="101" fill="#333" font-family="Arial, sans-serif" font-size="42">×</text>
  <rect x="310" y="108" width="162" height="56" fill="#f8f8f8" stroke="#bdb6aa"/><rect x="472" y="108" width="162" height="56" fill="#fff" stroke="#6b6254" stroke-width="2"/><rect x="634" y="108" width="162" height="56" fill="#f8f8f8" stroke="#bdb6aa"/><rect x="796" y="108" width="104" height="56" fill="#f8f8f8" stroke="#bdb6aa"/>
  <text x="345" y="140" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">공동인증서</text><text x="366" y="158" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">로그인</text>
  <text x="506" y="140" fill="#6b5431" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16" font-weight="700">클라우드인증서</text><text x="529" y="158" fill="#6b5431" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16" font-weight="700">로그인</text>
  <text x="668" y="140" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">브라우저인증서</text><text x="689" y="158" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">로그인</text><text x="823" y="144" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">ID 로그인</text>
  <text x="462" y="278" fill="#333" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24">클라우드 인증서 로그인만으로</text><text x="455" y="314" fill="#e13a2f" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24">모든 서비스 이용이 가능합니다.</text>
  <rect x="475" y="354" width="260" height="62" fill="#ffba16"/><text x="520" y="394" fill="#111" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700">클라우드인증서 로그인</text>
  <rect x="408" y="445" width="17" height="17" rx="2" fill="#147bd1"/><path d="M412 453l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="433" y="460" fill="#345" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">주문시자동서명</text><rect x="558" y="445" width="17" height="17" rx="2" fill="#fff" stroke="#777"/><text x="583" y="460" fill="#345" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">PC방화벽</text><text x="701" y="460" fill="#345" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">자동로그아웃  1시간</text>
  <rect x="310" y="492" width="590" height="102" fill="#f5f5f5"/><text x="335" y="528" fill="#172033" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="700">[안내] 클라우드 인증서 등록 방법</text><text x="335" y="556" fill="#475569" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">• 공동인증서를 보유한 고객 · 공동인증서가 없는 고객</text><text x="335" y="582" fill="#475569" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">• 타사에서 발급한 클라우드 인증서를 보유한 고객</text>
  <rect x="333" y="620" width="534" height="32" rx="6" fill="#fff4d6" stroke="#d3a832"/><text x="355" y="642" fill="#765400" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14" font-weight="700">공용 PC에서는 자동서명·ID 저장을 켜지 말고, 사용 후 로그아웃하세요.</text>
