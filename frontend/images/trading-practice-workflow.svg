<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
<title id="title">TradingView 전략 검증 흐름</title><desc id="desc">차트 설정, Pine Editor, 차트 적용, Strategy Report, 알림, 모의 주문 순서를 보여주는 교육용 다이어그램</desc>
<rect width="1200" height="360" rx="24" fill="#F7FAFF"/><text x="62" y="65" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172554">TradingView · 전략 검증을 주문 전에 끝내는 흐름</text>
<g font-family="Arial,sans-serif"><g><rect x="55" y="120" width="150" height="132" rx="15" fill="#E0EDFF" stroke="#8DB7FF"/><text x="78" y="165" font-size="17" font-weight="700" fill="#1E3A8A">1. 차트 설정</text><text x="78" y="194" font-size="13" fill="#334155">종목 · 거래소</text><text x="78" y="215" font-size="13" fill="#334155">시간봉 · 기간</text></g><text x="219" y="193" font-size="30" fill="#2563EB">→</text><g><rect x="250" y="120" width="150" height="132" rx="15" fill="#E7F9F0" stroke="#72D6A0"/><text x="275" y="165" font-size="17" font-weight="700" fill="#166534">2. Pine Editor</text><text x="275" y="194" font-size="13" fill="#334155">strategy() 확인</text><text x="275" y="215" font-size="13" fill="#334155">코드 저장</text></g><text x="414" y="193" font-size="30" fill="#2563EB">→</text><g><rect x="445" y="120" width="150" height="132" rx="15" fill="#FFF7E6" stroke="#F4C66A"/><text x="469" y="165" font-size="17" font-weight="700" fill="#92400E">3. 차트 적용</text><text x="469" y="194" font-size="13" fill="#334155">Add to chart</text><text x="469" y="215" font-size="13" fill="#334155">신호 위치 확인</text></g><text x="609" y="193" font-size="30" fill="#2563EB">→</text><g><rect x="640" y="120" width="150" height="132" rx="15" fill="#F5F0FF" stroke="#BCA2F5"/><text x="660" y="165" font-size="17" font-weight="700" fill="#5B21B6">4. Strategy Report</text><text x="660" y="194" font-size="13" fill="#334155">수수료 · 슬리피지</text><text x="660" y="215" font-size="13" fill="#334155">MDD · 거래내역</text></g><text x="804" y="193" font-size="30" fill="#2563EB">→</text><g><rect x="835" y="120" width="150" height="132" rx="15" fill="#FFF1F2" stroke="#FDA4AF"/><text x="862" y="165" font-size="17" font-weight="700" fill="#9F1239">5. 알림 · 모의</text><text x="862" y="194" font-size="13" fill="#334155">경보 1회 테스트</text><text x="862" y="215" font-size="13" fill="#334155">주문 전 로그 확인</text></g></g>
<text x="62" y="308" font-family="Arial,sans-serif" font-size="14" fill="#475569">교육용 요약 · 실제 주문 연결 전에는 신호 중복, 재도색(repainting), 수수료와 체결 가정을 검토하세요.</text></svg>
